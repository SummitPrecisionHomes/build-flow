services:
  - type: web
    name: buildflow-web
    env: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "gunicorn buildflow.wsgi:application"
    envVars:
      - key: DJANGO_SECRET_KEY
        sync: false
      - key: DJANGO_DEBUG
        value: false
      - key: DATABASE_URL
        fromDatabase:
          name: buildflow-db
          property: connectionString
  - type: postgresql
    name: buildflow-db
    plan: free