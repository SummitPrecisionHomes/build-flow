services:
  - type: web
    name: buildflow
    env: python
    plan: free
    repo: https://github.com/SummitPrecisionHomes/build-flow
    branch: main
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn buildflow.wsgi:application
    preDeployCommand: python manage.py migrate
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: False
      - key: DATABASE_URL
        value: sqlite:///db.sqlite3
      - key: DATABASE_SSL
        value: False
      - key: PYTHON_VERSION
        value: "3.11"